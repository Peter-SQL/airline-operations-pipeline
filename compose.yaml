services:

  postgres:
    image: postgres:17
    container_name: airline-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: airline-airflow
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      AIRFLOW_HOME: /opt/airflow

      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_USER}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json

      AIRFLOW_USER: ${AIRFLOW_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      AIRFLOW__SMTP__SMTP_HOST: smtp.web.de
      AIRFLOW__SMTP__SMTP_PORT: 587
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_SMTP_FROM}

      AIRFLOW_SMTP_USER: ${AIRFLOW_SMTP_USER}
      AIRFLOW_SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
      AIRFLOW_SMTP_FROM: ${AIRFLOW_SMTP_FROM}

      AIRFLOW_CONN_SMTP_DEFAULT: >-
        smtp://${AIRFLOW_SMTP_USER}:${AIRFLOW_SMTP_PASSWORD}@smtp.web.de:587?disable_ssl=true&from_email=${AIRFLOW_SMTP_FROM}

      PYTHONPATH: /opt/airflow/project

    volumes:
      - ./:/opt/airflow/project
      - ./airflow_dir/dags:/opt/airflow/dags





    working_dir: /opt/airflow/project

    ports:
      - "8081:8080"

    entrypoint: /bin/bash

    command:
      - -c
      - |
        python -c 'import json,os; json.dump({os.environ["AIRFLOW_USER"]: os.environ["AIRFLOW_PASSWORD"]}, open("/opt/airflow/simple_auth_manager_passwords.json","w"))'
        exec airflow standalone


volumes:
  postgres_data: